[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosupply"
version = "0.1.0"
description = "India-centric geopolitical supply chain intelligence platform"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [{name = "GeoSupply Team"}]

# Base runtime — everything needed to run the REST API, the OSINT live
# dashboard, the CLIs, and the full swarm's pure-Python logic. The heavy
# ML / vector-DB / graph backends are lazy-imported and live in the
# `full` extra, so the default install stays small and fast.
dependencies = [
    "pydantic>=2.0,<3.0",
    "httpx>=0.25.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "structlog>=23.0.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
    "colorama>=0.4.6",
    "python-dotenv>=1.0.0",
    # MCP + LLM backend (Tier-2/3 workers, MCP server)
    "anthropic>=0.40.0",
    "mcp>=1.0.0",
    # Auth + secrets
    "pyotp>=2.9.0",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
# Heavy backends for the FULL swarm (ML scoring, vector RAG, graph DB,
# Streamlit portal, Postgres). Not needed for the OSINT dashboard.
full = [
    "chromadb>=0.4.0",
    "supabase>=2.18.0,<2.20.0",
    "xgboost>=2.0.0",
    "sentence-transformers>=2.2.0",
    "networkx>=3.0",
    "neo4j>=5.0.0",
    "streamlit>=1.30.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
geosupply = "geosupply.cli.audit:main"
geosupply-start = "geosupply.cli.start:main"
geosupply-api = "geosupply.api.main:main"
geosupply-mcp = "geosupply.mcp.server:main"
geosupply-admin = "geosupply.cli.admin_cli:main"
geosupply-dashboard = "geosupply.dashboard.admin_dashboard:main"
geosupply-playground = "geosupply.dashboard.playground:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.setuptools.packages.find]
where = ["src"]
